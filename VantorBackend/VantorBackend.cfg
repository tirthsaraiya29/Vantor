[Scan]
# Scan thresholds
ml_threshold = 0.7
heuristic_threshold = 0.7
sig_hit_threshold = 1.0

[Paths]
quarantine_dir = quarantine
whitelist_file = whitelist.txt
signature_db = signatures.db

[Performance]
ram_boost_enabled = true
ram_boost_min_mb = 200
ram_boost_interval_sec = 300

[startup]
optimize_heavy_apps = true
monitor_interval_sec = 30

[ML]
model_files = ember.json
nthreads = 2
